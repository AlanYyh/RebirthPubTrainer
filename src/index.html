<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rebirth Pub 修改器</title>
<style>
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif; background:#ffffff; color:#333333; overflow:hidden;}
#app{display:flex; height:100vh;}
#sidebar{
  width:150px; flex:0 0 150px; background:#f5f6f7; border-right:1px solid #e0e0e0;
  display:flex; flex-direction:column; padding-top:14px;
}
.logo{padding:0 16px 14px; font-size:15px; font-weight:600; border-bottom:1px solid #e0e0e0; margin-bottom:6px;}
.nav{
  padding:10px 20px; text-align:left; border:none; background:transparent;
  cursor:pointer; font-size:14px; color:#333333; width:100%;
}
.nav:hover{background:#ececec;}
.nav.active{background:#e3effb; color:#1a6fd4; font-weight:600;}
#conn{margin-top:auto; padding:12px 16px; font-size:12px; color:#777777; border-top:1px solid #e0e0e0;}
#conn .dot{display:inline-block; width:7px; height:7px; border-radius:50%; background:#bbbbbb; margin-right:6px; vertical-align:middle;}
#conn.on .dot{background:#1a7f37;}
#conn.on{color:#333333;}
#content{flex:1; overflow-y:auto; padding:18px 24px;}
.page-title{font-size:17px; font-weight:600; margin-bottom:2px;}
.page-sub{font-size:12px; color:#888888; margin-bottom:12px;}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:10px;}
.card{border:1px solid #e0e0e0; border-radius:4px; padding:12px 14px; cursor:pointer; background:#ffffff;}
.card:hover{border-color:#1a6fd4;}
.card .name{font-size:13px; color:#666666;}
.card .val{font-size:22px; font-weight:600; color:#333333; margin-top:2px;}
.list{border:1px solid #e0e0e0; border-radius:4px; overflow:hidden;}
.row{display:flex; align-items:center; justify-content:space-between; padding:8px 14px; border-bottom:1px solid #f0f0f0; cursor:pointer; background:#ffffff;}
.row:last-child{border-bottom:none;}
.row:hover{background:#f5f8fc;}
.row .nm{font-size:14px;}
.row .vl{font-size:14px; color:#1a6fd4;}
.group-label{font-size:13px; font-weight:600; color:#333333; margin:12px 0 6px;}
.btn{display:inline-block; padding:8px 20px; border:1px solid #1a6fd4; background:#1a6fd4; color:#ffffff; border-radius:4px; cursor:pointer; font-size:14px;}
.btn:hover{background:#0f5cb8;}
.btn.ghost{background:#ffffff; color:#333333; border-color:#cccccc;}
.btn.ghost:hover{background:#f5f5f5;}
.btn-row{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:10px;}
.about{max-width:720px; line-height:1.9; font-size:14px;}
.about .big{font-size:18px; font-weight:600; margin-bottom:2px;}
.about a{color:#1a6fd4; text-decoration:underline;}
.about .note{color:#999999; font-size:13px;}
.about .qr-box{display:flex; gap:18px; margin-top:12px;}
.about .qr-box img{width:160px; height:160px; border:1px solid #e0e0e0; border-radius:4px; background:#ffffff;}
.about .qr-cap{text-align:center; font-size:12px; color:#666666; margin-top:4px;}
#modal{position:fixed; inset:0; background:rgba(0,0,0,.3); display:none; align-items:center; justify-content:center; z-index:20;}
#modal.show{display:flex;}
.modal-box{width:320px; background:#ffffff; border:1px solid #cccccc; border-radius:4px; padding:20px; box-shadow:0 6px 20px rgba(0,0,0,.15);}
.modal-box h3{font-size:15px; margin-bottom:4px;}
.modal-box .cur{color:#888888; font-size:13px; margin-bottom:12px;}
.modal-box input{width:100%; padding:8px 10px; border:1px solid #cccccc; border-radius:4px; font-size:15px; outline:none; margin-bottom:14px;}
.modal-box input:focus{border-color:#1a6fd4;}
.modal-box .btns{display:flex; gap:10px; justify-content:flex-end;}
#toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#333333; color:#ffffff; padding:8px 18px; border-radius:4px; font-size:13px; display:none; z-index:30;}
#toast.show{display:block;}
#toast.ok{background:#1a7f37;}
#toast.err{background:#c0392b;}
::-webkit-scrollbar{width:9px;}
::-webkit-scrollbar-thumb{background:#d0d0d0; border-radius:5px;}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="logo">Rebirth Pub 修改器</div>
    <button class="nav active" data-page="currency">货币</button>
    <button class="nav" data-page="heroine">角色</button>
    <button class="nav" data-page="item">道具</button>
    <button class="nav" data-page="skill">技能</button>
    <button class="nav" data-page="gallery">图鉴</button>
    <button class="nav" data-page="about">关于</button>
    <div id="conn"><span class="dot"></span><span id="conn-text">连接中…</span></div>
  </aside>
  <main id="content"></main>
</div>
<div id="modal">
  <div class="modal-box">
    <h3 id="m-title">修改</h3>
    <div class="cur" id="m-cur"></div>
    <input id="m-input" type="number" inputmode="numeric">
    <div class="btns">
      <button class="btn ghost" id="m-cancel">取消</button>
      <button class="btn" id="m-ok">确定</button>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
var CURRENCY = [
  {id:"Gold", name:"金币"},
  {id:"SoulJam", name:"魂石"},
  {id:"AP", name:"行动点"},
  {id:"Stamina", name:"体力"},
  {id:"SkillPoint", name:"技能点"}
];
var HEROINES = [
  {id:"Nicole", name:"妮可"},
  {id:"Irene", name:"艾琳"},
  {id:"Serena", name:"瑟蕾娜"}
];
var NPCS = [
  {id:"Market_Merchant", name:"市场商人"},
  {id:"BlackMarket_Merchant", name:"黑市商人"},
  {id:"Clown", name:"小丑"},
  {id:"Priest", name:"神父"},
  {id:"Elena", name:"艾莲娜"},
  {id:"Marie", name:"玛丽"},
  {id:"Logan", name:"罗根"},
  {id:"Nix", name:"尼克斯"},
  {id:"Bob", name:"鲍勃"},
  {id:"Runa", name:"露娜"},
  {id:"Teddy", name:"泰迪"},
  {id:"Jack", name:"杰克"},
  {id:"Charlotte", name:"夏洛特"}
];
var ITEMS = [
  ["NormalRecipePiece","普通食谱碎片"],["RareRecipePiece","稀有食谱碎片"],["LegendaryRecipePiece","传说食谱碎片"],
  ["NormalCostumePiece","普通服装碎片"],["RareCostumePiece","稀有服装碎片"],["LegendaryCostumePiece","传说服装碎片"],
  ["NormalRelicPiece","普通遗物碎片"],["RareRelicPiece","稀有遗物碎片"],["LegendaryRelicPiece","传说遗物碎片"],
  ["Ruby","红宝石"],["Sapphire","蓝宝石"],["Emerald","绿宝石"],["Topaz","黄玉"],
  ["NormalRecipe","普通食谱"],["RareRecipe","稀有食谱"],["LegendaryRecipe","传说食谱"],
  ["Chocolate","巧克力"],["EnergyBar","能量棒"],["EnergyDrink","能量饮料"],
  ["LegendaryMushroom","传说蘑菇"],["HolyWater","圣水"],["CookieSet","曲奇套装"],["StrawberryCake","草莓蛋糕"],
  ["Bouquet","花束"],["PoetryBook","诗集"],["LuxuryPerfume","高级香水"],["StuffedDoll","玩偶"],
  ["LuxuryCushion","高级靠垫"],["SnowGlobe","雪花球"],["SilkScarf","丝巾"],["VintageWine","陈年红酒"],
  ["JewelMusicBox","宝石音乐盒"],["LovePotion","爱情药水"],["RedPetal","红色花瓣"],["BluePetal","蓝色花瓣"],
  ["SkillBook","技能书"],["AdvSkillBook","高级技能书"],["MagicalTeaLeaf","魔法茶叶"],["SacredTeaLeaf","神圣茶叶"],
  ["MysteryBox","神秘盒子"],["AdvMysteryBox","高级神秘盒子"],
  ["SecretMapA","秘密地图A"],["SecretMapB","秘密地图B"],["SecretMapC","秘密地图C"],["SecretMapD","秘密地图D"]
];
var SKILLS = [
  ["PowerUp_01","攻击强化"],["AvoidUp_01","闪避强化"],["PowerUp_02","攻击强化 II"],["Turret_01","炮塔"],
  ["LuckUp_01","幸运强化"],["TurretPowerUp_01","炮塔强化"],["MoreTurret_01","炮塔 +1"],["LuckUp_02","幸运强化 II"],
  ["MoveSpeedUp_01","移速强化"],["Protector_01","护盾"],["AvoidUp_02","闪避强化 II"],["ProtectorUpgrade_01","护盾强化"],
  ["Rebirth_01","重生"],["AttackSpeedUp_01","攻速强化"],["Magnetic_01","磁力"],["IceFairy_01","冰精灵"],
  ["MaxHP_01","生命上限"],["IceFairySlowUpgrade_01","冰精灵减速强化"],["MoreIceFairy_01","冰精灵 +1"],["MaxHP_02","生命上限 II"],
  ["BetterPotion","强化药水"],["ChainAttack_01","连锁攻击"],["AttackSpeedUp_02","攻速强化 II"],["ChainAttackUpgrade_01","连锁攻击强化"],
  ["ImmediateDeath","即死"]
];

var state = { page:"currency", values:{}, hello:null };
var PAGES = {
  currency:{title:"货币", sub:"点击卡片修改数值", cats:["currency"]},
  heroine:{title:"角色", sub:"点击列表项修改好感度", cats:["heroine","npc"]},
  item:{title:"道具", sub:"点击列表项修改数量", cats:["item"]},
  skill:{title:"技能", sub:"点击列表项修改等级", cats:["skill"]},
  gallery:{title:"图鉴", sub:"", cats:[]},
  about:{title:"关于", sub:"", cats:[]}
};

function post(m){ if(window.chrome && chrome.webview){ chrome.webview.postMessage(m); } }
function onMsg(e){
  var m = typeof e.data === "string" ? JSON.parse(e.data) : e.data;
  if(m.type === "hello"){ state.hello = m; updateConn(); }
  else if(m.type === "values"){ state.values[m.category] = m.data; if(isCurrent(m.category)) render(); }
  else if(m.type === "status"){ toast(m.text||"", m.ok!==false); if(m.ok) refreshCurrent(); }
}
if(window.chrome && chrome.webview){ chrome.webview.addEventListener("message", onMsg); }

function updateConn(){
  var el = document.getElementById("conn");
  var txt = document.getElementById("conn-text");
  if(state.hello && state.hello.state === "ready"){ el.classList.add("on"); txt.textContent = "已连接游戏"; }
  else if(state.hello && state.hello.state === "notready"){ el.classList.remove("on"); txt.textContent = "游戏未载入存档"; }
  else { el.classList.remove("on"); txt.textContent = "未连接游戏"; }
}

function toast(text, ok){
  var el = document.getElementById("toast");
  el.textContent = text;
  el.className = ok ? "show ok" : "show err";
  clearTimeout(el._t); el._t = setTimeout(function(){ el.className = ""; }, 2000);
}

function isCurrent(cat){
  if(state.page === "currency") return cat === "currency";
  if(state.page === "heroine") return cat === "heroine" || cat === "npc";
  if(state.page === "item") return cat === "item";
  if(state.page === "skill") return cat === "skill";
  return false;
}

function switchPage(page){
  state.page = page;
  document.querySelectorAll(".nav").forEach(function(b){ b.classList.toggle("active", b.dataset.page === page); });
  render();
  loadValues();
}

function loadValues(){ PAGES[state.page].cats.forEach(function(c){ post({type:"get", category:c}); }); }
function refreshCurrent(){ loadValues(); }

function render(){
  var c = document.getElementById("content");
  var p = PAGES[state.page];
  var html = '<div class="page-title">' + p.title + '</div>';
  if(p.sub) html += '<div class="page-sub">' + p.sub + '</div>';
  if(state.page === "currency") html += renderCurrency();
  else if(state.page === "heroine") html += renderHeroine();
  else if(state.page === "item") html += renderItems();
  else if(state.page === "skill") html += renderSkills();
  else if(state.page === "gallery") html += renderGallery();
  else if(state.page === "about") html += renderAbout();
  c.innerHTML = html;
}

function v(cat, id){ var d = state.values[cat]; return d && d[id] !== undefined ? d[id] : 0; }

function renderCurrency(){
  var rows = CURRENCY.map(function(it){
    return '<div class="card" onclick="edit(\'currency\',\''+it.id+'\',\''+it.name+'\')">' +
      '<div class="name">'+it.name+'</div><div class="val">'+v("currency",it.id)+'</div></div>';
  }).join("");
  return '<div class="grid">'+rows+'</div>';
}

function renderHeroine(){
  var h = HEROINES.map(function(it){ return rowHtml("heroine", it.id, it.name); }).join("");
  var n = NPCS.map(function(it){ return rowHtml("npc", it.id, it.name); }).join("");
  return '<div class="group-label">女主角</div><div class="list">'+h+'</div><div class="group-label">NPC</div><div class="list">'+n+'</div>';
}

function renderItems(){
  var rows = ITEMS.map(function(it){ return rowHtml("item", it[0], it[1]); }).join("");
  return '<div class="btn-row"><button class="btn" onclick="setAll(\'item\',99)">全部道具设为 99</button>' +
    '<button class="btn ghost" onclick="setAll(\'item\',999)">全部道具设为 999</button></div><div class="list">'+rows+'</div>';
}

function renderSkills(){
  var sp = rowHtml("skill", "SkillPoint", "技能点");
  var rows = SKILLS.map(function(it){ return rowHtml("skill", it[0], it[1]); }).join("");
  return '<div class="group-label">技能点</div><div class="list">'+sp+'</div><div class="group-label">技能等级</div><div class="list">'+rows+'</div>';
}

function renderGallery(){
  return '<div class="btn-row" style="flex-direction:column; align-items:flex-start; gap:8px">' +
    '<button class="btn" onclick="unlock(\'gallery\')">一键解锁全部图鉴</button>' +
    '<button class="btn" onclick="unlock(\'costume\')">解锁全部服装</button>' +
    '<button class="btn" onclick="unlock(\'relic\')">解锁全部遗物</button></div>';
}

function renderAbout(){
  return '<div class="about">' +
    '<div class="big">Rebirth Pub 修改器</div>' +
    '<div>版本 v1.0　·　对应游戏版本 0.65</div>' +
    '<div>本修改器完全免费且开源，地址：<a href="#" onclick="openUrl(\'https://github.com/AlanYyh/RebirthPubTrainer\');return false;">https://github.com/AlanYyh/RebirthPubTrainer</a></div>' +
    '<div class="note">该项目地址在海外，需要梯子访问</div>' +
    '<div>如果你是收费获取，投诉你的卖家。</div>' +
    '<div>如果修改器有问题，请向作者提交 issues。</div>' +
    '<div class="qr-box"><div><img src="{{QR1}}"><div class="qr-cap">赞赏码 1</div></div>' +
    '<div><img src="{{QR2}}"><div class="qr-cap">赞赏码 2</div></div></div>' +
    '</div>';
}

function rowHtml(cat, id, name){
  return '<div class="row" onclick="edit(\''+cat+'\',\''+id+'\',\''+name+'\')">' +
    '<span class="nm">'+name+'</span><span class="vl">'+v(cat,id)+'</span></div>';
}

function edit(cat, id, name){
  var cur = v(cat, id);
  document.getElementById("m-title").textContent = "修改 " + name;
  document.getElementById("m-cur").textContent = "当前值：" + cur;
  var inp = document.getElementById("m-input");
  inp.value = cur;
  document.getElementById("modal").classList.add("show");
  inp.focus(); inp.select();
  window._edit = {cat:cat, id:id};
}

function closeModal(){ document.getElementById("modal").classList.remove("show"); }

document.getElementById("m-ok").onclick = function(){
  var val = parseInt(document.getElementById("m-input").value, 10);
  if(isNaN(val)){ toast("请输入有效数字", false); return; }
  post({type:"set", category:window._edit.cat, id:window._edit.id, value:val});
  closeModal();
};
document.getElementById("m-cancel").onclick = closeModal;
document.getElementById("modal").onclick = function(e){ if(e.target === this) closeModal(); };
document.getElementById("m-input").addEventListener("keydown", function(e){ if(e.key === "Enter") document.getElementById("m-ok").click(); });

function setAll(target, value){ post({type:"setall", target:target, value:value}); }
function unlock(what){ post({type:"unlock", what:what}); }
function openUrl(url){ post({type:"open", url:url}); }

document.querySelectorAll(".nav").forEach(function(b){ b.onclick = function(){ switchPage(b.dataset.page); }; });

post({type:"hello"});
switchPage("currency");
setInterval(function(){ post({type:"hello"}); refreshCurrent(); }, 2500);
</script>
</body>
</html>
